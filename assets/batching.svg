<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="900" height="380" rx="20" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The #1 money trick: one envelope, many questions</text>
  <!-- left -->
  <rect x="30" y="66" width="410" height="290" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
  <text x="235" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="#c92a2a">❌ 13 separate calls</text>
  <g font-size="26">
    <text x="60" y="150">✉️</text><text x="100" y="150">✉️</text><text x="140" y="150">✉️</text><text x="180" y="150">✉️</text><text x="220" y="150">✉️</text><text x="260" y="150">✉️</text><text x="300" y="150">✉️</text>
    <text x="80" y="192">✉️</text><text x="120" y="192">✉️</text><text x="160" y="192">✉️</text><text x="200" y="192">✉️</text><text x="240" y="192">✉️</text><text x="280" y="192">✉️</text>
  </g>
  <text x="60" y="232" font-size="14" fill="#555">Each envelope carries the SAME long document</text>
  <text x="60" y="252" font-size="14" fill="#555">+ one question. You pay for the document 13×.</text>
  <text x="235" y="300" text-anchor="middle" font-size="30" font-weight="800" fill="#c92a2a">$0.00609</text>
  <text x="235" y="326" text-anchor="middle" font-size="13" fill="#777">13 round trips</text>
  <!-- right -->
  <rect x="460" y="66" width="410" height="290" rx="16" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="665" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="#2b8a3e">✅ 1 batched call</text>
  <text x="665" y="175" text-anchor="middle" font-size="64">📦</text>
  <text x="490" y="232" font-size="14" fill="#555">One envelope: the document ONCE</text>
  <text x="490" y="252" font-size="14" fill="#555">+ all 13 questions. Answers come back together.</text>
  <text x="665" y="300" text-anchor="middle" font-size="30" font-weight="800" fill="#2b8a3e">$0.00050</text>
  <text x="665" y="326" text-anchor="middle" font-size="13" fill="#777">1 round trip · 12.2× cheaper · 10× faster</text>
  <text x="450" y="372" text-anchor="middle" font-size="11" fill="#999">Numbers from TypeSafe's "Parallel questions" cookbook (13 questions over the GDPR Wikipedia article)</text>
</svg>
