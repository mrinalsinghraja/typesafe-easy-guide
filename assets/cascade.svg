<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="900" height="420" rx="20" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">The "cheap first, expensive only if needed" ladder</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#495057"/></marker></defs>
  <rect x="30" y="80" width="170" height="90" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
  <text x="115" y="115" text-anchor="middle" font-size="30">📥</text>
  <text x="115" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">All the work</text>
  <line x1="200" y1="125" x2="245" y2="125" stroke="#495057" stroke-width="3" marker-end="url(#a)"/>
  <rect x="250" y="80" width="190" height="90" rx="14" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="345" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1864ab">1. Cheap model</text>
  <text x="345" y="134" text-anchor="middle" font-size="13" fill="#1864ab">does the job</text>
  <text x="345" y="156" text-anchor="middle" font-size="13" fill="#1864ab">(e.g. a "mini" LLM)</text>
  <line x1="440" y1="125" x2="485" y2="125" stroke="#495057" stroke-width="3" marker-end="url(#a)"/>
  <rect x="490" y="80" width="190" height="90" rx="14" fill="#e6fcf5" stroke="#0ca678" stroke-width="2"/>
  <text x="585" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#087f5b">2. Jev checks it</text>
  <text x="585" y="134" text-anchor="middle" font-size="13" fill="#087f5b">"Is this field wrong?"</text>
  <text x="585" y="156" text-anchor="middle" font-size="13" fill="#087f5b">a Noul per field</text>
  <line x1="680" y1="110" x2="735" y2="100" stroke="#2f9e44" stroke-width="3" marker-end="url(#a)"/>
  <line x1="680" y1="145" x2="735" y2="225" stroke="#e03131" stroke-width="3" marker-end="url(#a)"/>
  <rect x="740" y="62" width="135" height="80" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="807" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#2b8a3e">✅ Looks right</text>
  <text x="807" y="116" text-anchor="middle" font-size="13" fill="#2b8a3e">keep it (most</text>
  <text x="807" y="132" text-anchor="middle" font-size="13" fill="#2b8a3e">cases stop here)</text>
  <rect x="740" y="190" width="135" height="80" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
  <text x="807" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#c92a2a">⚠️ Doubtful</text>
  <text x="807" y="244" text-anchor="middle" font-size="13" fill="#c92a2a">send to big</text>
  <text x="807" y="260" text-anchor="middle" font-size="13" fill="#c92a2a">model or human</text>
  <rect x="30" y="300" width="840" height="100" rx="14" fill="#f8f9fa"/>
  <text x="50" y="330" font-size="15" font-weight="700" fill="#343a40">TypeSafe's cookbook result (100 test cases):</text>
  <text x="50" y="356" font-size="15" fill="#343a40">Big model alone ≈ <tspan font-weight="700" fill="#c92a2a">$0.30</tspan> per job  ·  Ladder ≈ <tspan font-weight="700" fill="#2b8a3e">$0.10</tspan> per job  ·  Quality: most of the big model's (≈0.81)</text>
  <text x="50" y="382" font-size="13" fill="#777">Jev price in that cookbook: $0.042 per 1M input tokens, output tokens free (Sep 2026). Check current pricing.</text>
</svg>
